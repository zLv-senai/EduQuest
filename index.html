<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduQuest</title>
<link rel="icon" id="favicon" href="data:,">
<meta name="theme-color" content="#6C3BD2">
<style>
  :root{
    --fundo:#1E0A47;       /* fundo escuro, roxo do icone puxado ao quase preto */
    --marinho:#1E357E;
    --roxo:#6C3BD2;        /* roxo do icone, parte de cima */
    --roxo-esc:#5221AE;    /* roxo do icone, parte de baixo */
    --roxo-claro:#8B62E4;  /* clareado a partir do roxo do icone */
    --roxo-input:#4B1AA7;  /* o ponto mais escuro do icone */
    --amarelo:#EFCE74;     /* dourado do capelo */
    --verde:#8BCD6A;       /* verde puxado para o quente, perto do dourado */
    --vermelho:#FF4D6D;
    --ciano:#4CD4F0;
    --rosa:#FF5C8A;
    --azul:#8FB7F7;
    --texto:#FFFFFF;
    --texto-fraco:#E2D6FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--fundo);
    color:var(--texto-fraco);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:12px 0 40px;
  }
  #app{width:380px;max-width:100%;padding:0 14px}

  /* ---------- cabecalho ---------- */
  .topo{
    display:flex;align-items:center;gap:8px;
    background:var(--roxo);
    border:3px solid var(--marinho);
    border-radius:18px;
    padding:8px 10px;
    margin-bottom:12px;
    box-shadow:0 5px 0 var(--marinho);
  }
  .logo{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:9px;
    font-size:27px;font-weight:900;letter-spacing:.5px;
  }
  .marca{flex:none;width:36px;height:36px}
  .marca svg,.marca img{width:100%;height:100%;display:block}
  .palavra{text-shadow:0 3px 0 var(--marinho)}
  .palavra span:nth-child(1){color:var(--amarelo)}
  .palavra span:nth-child(2){color:var(--amarelo)}
  .palavra span:nth-child(3){color:var(--amarelo)}
  .palavra span:nth-child(4){color:var(--verde)}
  .palavra span:nth-child(5){color:var(--verde)}
  .palavra span:nth-child(6){color:var(--amarelo)}
  .palavra span:nth-child(7){color:var(--amarelo)}
  .palavra span:nth-child(8){color:var(--verde)}

  .icone{
    width:42px;height:42px;flex:none;position:relative;
    border-radius:13px;border:3px solid var(--marinho);
    background:var(--roxo-esc);color:#fff;
    font-size:17px;line-height:1;cursor:pointer;font-family:inherit;
  }
  .icone:active{transform:translateY(2px)}
  .espaco{width:42px;flex:none}
  .badge{
    position:absolute;top:-7px;right:-7px;
    min-width:20px;height:20px;padding:0 4px;border-radius:10px;
    background:var(--vermelho);color:#fff;border:2px solid #fff;
    font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .badge.zero{background:#8E8AA8}

  /* ---------- abas ---------- */
  .abas{display:flex;gap:6px;margin-bottom:14px}
  .aba{
    flex:1;padding:9px 2px;border-radius:12px;
    border:3px solid var(--marinho);
    background:var(--roxo);color:#fff;
    font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;
    box-shadow:0 3px 0 var(--marinho);
  }
  .aba.ativa{background:var(--amarelo);color:var(--marinho)}
  .aba:active{transform:translateY(2px);box-shadow:0 1px 0 var(--marinho)}

  /* ---------- cartoes ---------- */
  .card{
    background:var(--roxo);
    color:var(--texto);
    border:3px solid var(--marinho);
    border-radius:20px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 5px 0 var(--marinho);
  }
  .card h2,.modal h2{
    background:var(--roxo-esc);
    border:2px solid var(--marinho);
    border-radius:12px;
    padding:7px 10px;
    margin-bottom:14px;
    text-align:center;
    font-size:14px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;color:#fff;
  }

  label{display:block;font-size:11px;color:var(--texto-fraco);margin-bottom:5px;font-weight:700}
  input,select{
    width:100%;padding:10px;border-radius:12px;
    border:2px solid var(--marinho);
    background:var(--roxo-input);color:#fff;font-size:14px;font-family:inherit;
  }
  input:focus,select:focus{outline:none;border-color:var(--amarelo)}
  select option{background:#4B1AA7;color:#fff}

  button.acao{
    width:100%;padding:12px;border-radius:14px;
    border:3px solid var(--marinho);
    background:var(--amarelo);color:var(--marinho);
    font-weight:800;font-size:14px;font-family:inherit;
    cursor:pointer;box-shadow:0 4px 0 var(--marinho);
  }
  button.acao:active{transform:translateY(2px);box-shadow:0 2px 0 var(--marinho)}
  button.acao.verde{background:var(--verde)}
  button.acao.cinza{background:var(--roxo-claro);color:#fff}
  button.acao.vermelha{background:var(--vermelho);color:#fff}

  .vazio{text-align:center;color:var(--texto-fraco);font-size:13px;padding:18px 6px;line-height:1.5}

  /* ---------- ficha do perfil: avatar + pilulas ---------- */
  .ficha{display:flex;gap:10px;align-items:stretch}
  .ficha-foto{
    width:38%;flex:none;border-radius:16px;
    border:3px solid var(--marinho);
    background:var(--azul);
    padding:6px;display:flex;align-items:center;
  }
  .ficha-foto svg{width:100%;display:block}
  .ficha-dados{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .linha-ficha{display:grid;grid-template-columns:62px 1fr;gap:5px;align-items:center}
  .rot{
    padding:5px 4px;border-radius:9px;text-align:center;
    background:var(--roxo-esc);border:2px solid var(--marinho);
    font-size:10px;font-weight:800;color:#fff;
  }
  .rot.vermelho{background:var(--vermelho)}
  .rot.amarelo{background:var(--amarelo);color:var(--marinho)}
  .val{
    padding:5px 8px;border-radius:9px;
    background:var(--roxo-claro);border:2px solid var(--marinho);
    font-size:11px;font-weight:700;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .val.verde{background:var(--verde);color:var(--marinho)}
  .val.amarelo{background:var(--amarelo);color:var(--marinho)}
  .val.ciano{background:var(--ciano);color:var(--marinho)}
  .val.vermelho{background:var(--vermelho)}
  .val-medalhas{display:flex;align-items:center;gap:1px;font-size:12px}
  .val-medalhas .mais{font-size:10px;font-weight:800;margin-left:3px}

  .stats{display:flex;gap:8px;margin-bottom:14px}
  .stat{
    flex:1;background:var(--roxo-esc);border:2px solid var(--marinho);
    border-radius:14px;padding:9px 4px;text-align:center;
  }
  .stat b{display:block;font-size:19px}
  .stat small{font-size:9px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:.5px}
  .stat.alerta b{color:var(--vermelho)}

  .xp-linha{display:flex;justify-content:space-between;font-size:11px;color:var(--texto-fraco);margin-bottom:5px;font-weight:700}
  .xp-fundo{height:18px;background:var(--roxo-input);border-radius:10px;overflow:hidden;border:2px solid var(--marinho)}
  .xp-barra{height:100%;background:linear-gradient(90deg,var(--verde),var(--ciano));transition:width .4s}

  .medalhas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .medalha{
    background:var(--roxo-esc);border:2px solid var(--marinho);
    border-radius:14px;padding:8px 3px;text-align:center;opacity:.38;filter:grayscale(1);
  }
  .medalha.ok{opacity:1;filter:none;background:var(--roxo-claro);border-color:var(--amarelo)}
  .medalha .ic{font-size:20px;display:block}
  .medalha .tx{font-size:8px;color:var(--texto-fraco);line-height:1.2;display:block;margin-top:3px}

  .lista-notas{margin-top:4px}
  .linha-nota{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--roxo-esc);border:2px solid var(--marinho);
    border-radius:11px;padding:8px 10px;margin-bottom:6px;font-size:12px;
  }
  .linha-nota b{font-weight:800;font-size:14px}
  .linha-nota.baixa{background:#B32843}
  .baixa{color:var(--vermelho)}
  .linha-nota.baixa b{color:#fff}

  /* ---------- turma ---------- */
  .barra-item{margin-bottom:12px}
  .barra-topo{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;font-weight:700}
  .barra-topo b{color:var(--amarelo)}
  .barra-topo b.baixa{color:#FFC2CC}
  .barra-fundo{height:22px;background:var(--roxo-input);border:2px solid var(--marinho);border-radius:12px;overflow:hidden}
  .barra-valor{height:100%;background:linear-gradient(90deg,var(--verde),var(--ciano));transition:width .5s}
  .barra-valor.baixa{background:linear-gradient(90deg,#C92A46,var(--vermelho))}

  /* ---------- gerenciar ---------- */
  .item-aluno{
    display:flex;align-items:center;gap:10px;
    background:var(--roxo-esc);border:2px solid var(--marinho);
    border-radius:14px;padding:9px;margin-bottom:8px;
  }
  .item-aluno .info{flex:1;min-width:0}
  .item-aluno .nome{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-aluno .meta{font-size:10px;color:var(--texto-fraco)}
  .mini-avatar{
    width:38px;height:38px;flex:none;border-radius:11px;overflow:hidden;
    border:2px solid var(--marinho);background:var(--azul);
  }
  .mini-avatar svg{width:100%;display:block}
  .del{
    border:2px solid var(--marinho);background:var(--vermelho);color:#fff;
    width:32px;height:32px;border-radius:10px;
    font-size:16px;font-weight:800;cursor:pointer;flex:none;font-family:inherit;
  }

  /* ---------- alertas ---------- */
  .alerta-item{
    display:flex;gap:8px;align-items:flex-start;
    background:var(--roxo-esc);border:2px solid var(--marinho);
    border-radius:12px;padding:9px 10px;margin-bottom:7px;font-size:12px;line-height:1.35;
  }
  .alerta-item .pt{font-size:14px;line-height:1.1}
  .alerta-item.risco{background:#B32843}
  .alerta-item.falta{background:#8A6A20}

  /* ---------- avisos ---------- */
  #avisos{position:fixed;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:99;pointer-events:none}
  .aviso{
    background:var(--marinho);color:#fff;border:3px solid var(--amarelo);
    padding:9px 16px;border-radius:14px;font-size:13px;font-weight:700;
    box-shadow:0 4px 12px rgba(20,25,70,.35);animation:cai .3s ease;
  }
  .aviso.erro{border-color:var(--vermelho)}
  @keyframes cai{from{transform:translateY(-18px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* ---------- caixa de confirmacao e painel ---------- */
  .modal-fundo{
    position:fixed;inset:0;z-index:60;padding:20px;
    background:rgba(20,25,70,.66);
    display:flex;align-items:center;justify-content:center;
    animation:surge .18s ease;
  }
  .modal{
    width:100%;max-width:330px;max-height:80vh;overflow-y:auto;padding:16px;
    background:var(--roxo);color:var(--texto);
    border:3px solid var(--marinho);
    border-radius:20px;box-shadow:0 10px 0 var(--marinho);
  }
  .modal p{font-size:14px;line-height:1.5;margin-bottom:16px}
  .modal-btns{display:flex;gap:10px}
  @keyframes surge{from{opacity:0}to{opacity:1}}

  /* ---------- desktop: painel do professor (a partir de 1000px) ---------- */
  @media (min-width:1000px){
    body{padding:16px 0 44px}
    #app{width:100%;max-width:1240px;padding:0 20px}

    .abas{display:none}      /* no painel tudo aparece junto, nao precisa de aba */
    .so-mobile{display:none}  /* o seletor de aluno vira a lista da lateral */

    .logo{font-size:32px}
    .topo{padding:10px 14px;margin-bottom:16px}

    .painel{
      display:grid;
      grid-template-columns:270px minmax(0,1fr) 320px;
      gap:14px;
      align-items:start;
    }
    .col-centro{min-width:0}
    .col-lado{min-width:0}

    /* o radar nao pode esticar junto com a coluna do meio */
    .col-centro > .card > svg{max-width:430px;display:block;margin:0 auto}

    .item-aluno{cursor:pointer}
    .item-aluno.ativo{border-color:var(--amarelo);background:var(--roxo-claro)}
  }

  /* ---------- escolha de perfil e visao do aluno ---------- */
  .tela-escolha{max-width:340px;margin:0 auto}
  .escolha-ou{
    text-align:center;font-size:11px;font-weight:800;letter-spacing:1px;
    color:var(--texto-fraco);margin:14px 0;
  }
  .nota-rodape{
    text-align:center;font-size:10px;line-height:1.6;
    color:var(--texto-fraco);opacity:.75;margin-top:4px;
  }
  #btnSair{visibility:hidden;font-size:20px}
  #btnSair.aparece{visibility:visible}

  @media (min-width:1000px){
    .tela-aluno{max-width:620px;margin:0 auto}
    .tela-escolha{max-width:380px}
  }
</style>
</head>
<body>
<div id="avisos"></div>

<div id="app">
  <div class="topo">
    <button class="icone" id="btnSair" title="Trocar de perfil" aria-label="Trocar de perfil">&#8592;</button>
    <div class="logo"><span class="marca" id="marca"></span><span class="palavra"><span>E</span><span>d</span><span>u</span><span>Q</span><span>u</span><span>e</span><span>s</span><span>t</span></span></div>
    <button class="icone" id="btnAlertas" title="Alertas da turma" aria-label="Alertas da turma">&#9993;<span class="badge" id="badgeAlertas">0</span></button>
  </div>

  <div class="abas">
    <button class="aba" data-aba="perfil">PERFIL</button>
    <button class="aba" data-aba="notas">NOTAS</button>
    <button class="aba" data-aba="turma">TURMA</button>
    <button class="aba" data-aba="gerenciar">GERENCIAR</button>
  </div>

  <div id="tela"></div>
</div>

<script>
/* =========================================================
   ETAPA 1 - MODELO DE DADOS + PERSISTENCIA (localStorage)
   ========================================================= */
var KEY = 'eduquest_v1';

var MATERIAS = ['Fundição','Soldagem','Conformação Mecânica','Ciência dos Materiais','Desenho Técnico'];
var ABREV    = ['Fundição','Soldagem','Conformação','Materiais','Desenho'];

var MEDALHAS = [
  { nome:'Primeira Nota', icone:'\u{1F31F}' },
  { nome:'Nota Máxima',   icone:'\u{1F48E}' },
  { nome:'Sem Faltas',    icone:'\u{1F3AF}' },
  { nome:'Nível 5',       icone:'\u{1F451}' }
];

var db  = { alunos: [] };   // banco em memoria, espelho do localStorage
var sel = null;             // id do aluno selecionado
var aba = 'perfil';

function uid(){
  return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

// matricula de 9 digitos, igual ao campo ID do mockup
function novaMatricula(){
  var s = '';
  for (var i=0;i<9;i++) s += Math.floor(Math.random()*10);
  return s;
}

function novasMaterias(){
  return MATERIAS.map(function(n){ return { nome:n, nota:0 }; });
}

function novoAluno(nome){
  return { id:uid(), matricula:novaMatricula(), nome:nome, faltas:0, xp:0, nivel:1, medalhas:[], materias:novasMaterias() };
}

function salvar(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ aviso('Não foi possível salvar neste navegador', true); }
}

function carregar(){
  var bruto = null;
  try { bruto = localStorage.getItem(KEY); } catch(e){ bruto = null; }

  var lido = null;
  if (bruto) {
    try { lido = JSON.parse(bruto); } catch(e){ lido = null; }
  }

  if (lido && Array.isArray(lido.alunos)) {
    db = lido;                       // ja existia dado salvo
  } else {
    db = { alunos: [] };             // primeiro carregamento
    semear();
    salvar();
  }
  // conserta registros incompletos vindos de versoes antigas
  db.alunos.forEach(function(a){
    if (!Array.isArray(a.materias) || !a.materias.length) a.materias = novasMaterias();
    if (!Array.isArray(a.medalhas)) a.medalhas = [];
    if (!a.matricula) a.matricula = novaMatricula();
    a.faltas = Number(a.faltas) || 0;
    a.xp     = Number(a.xp) || 0;
    a.nivel  = Number(a.nivel) || 1;
  });
  if (db.alunos.length) sel = db.alunos[0].id;
}

function semear(){
  var base = [
    { nome:'Ana Souza',  faltas:0, notas:[9,10,8.5,9.5,9], xp:60, nivel:5 },
    { nome:'Bruno Lima', faltas:3, notas:[7,6.5,8,5.5,7],  xp:40, nivel:3 },
    { nome:'Carla Dias', faltas:7, notas:[5,4.5,6,5,3.5],  xp:10, nivel:2 }
  ];
  base.forEach(function(b){
    var a = novoAluno(b.nome);
    a.faltas = b.faltas;
    a.xp     = b.xp;
    a.nivel  = b.nivel;
    a.materias.forEach(function(m,i){ m.nota = b.notas[i]; });
    conferirMedalhas(a);
    db.alunos.push(a);
  });
}

function acharAluno(id){
  for (var i=0;i<db.alunos.length;i++) if (db.alunos[i].id === id) return db.alunos[i];
  return null;
}

function alunoAtual(){ return acharAluno(sel); }

/* =========================================================
   REGRAS DE NEGOCIO
   ========================================================= */

// Media = soma das notas / quantidade de materias
function media(a){
  if (!a.materias.length) return 0;
  var soma = a.materias.reduce(function(s,m){ return s + Number(m.nota||0); }, 0);
  return soma / a.materias.length;
}

// Selo do perfil pela media
function selo(m){
  if (m >= 9) return { txt:'ÓTIMO ALUNO', cls:'otimo' };
  if (m >= 7) return { txt:'BOM ALUNO',   cls:'bom' };
  if (m >= 6) return { txt:'REGULAR',     cls:'regular' };
  return             { txt:'EM RISCO',    cls:'risco' };
}

// Nivel sobe enquanto xp >= 100 * nivel; ao subir, desconta o custo
function subirNivel(a){
  var subiu = [];
  while (a.xp >= 100 * a.nivel) {
    a.xp -= 100 * a.nivel;
    a.nivel += 1;
    subiu.push(a.nivel);
  }
  return subiu;
}

// Medalhas automaticas - devolve as que acabaram de ser conquistadas
function conferirMedalhas(a){
  var novas = [];
  function dar(nome){
    if (a.medalhas.indexOf(nome) === -1) { a.medalhas.push(nome); novas.push(nome); }
  }
  if (a.materias.some(function(m){ return Number(m.nota) > 0; }))   dar('Primeira Nota');
  if (a.materias.some(function(m){ return Number(m.nota) === 10; })) dar('Nota Máxima');
  if (a.faltas === 0) dar('Sem Faltas');
  if (a.nivel >= 5)   dar('Nível 5');
  return novas;
}

/* =========================================================
   UTILIDADES DE TELA
   ========================================================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function n1(v){ return (Math.round(v*10)/10).toFixed(1); }
function semZero(v){ return n1(v).replace(/\.0$/,''); }

function iniciais(nome){
  var p = nome.trim().split(/\s+/);
  return ((p[0]||'?')[0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase();
}

function aviso(msg, erro){
  var d = document.createElement('div');
  d.className = 'aviso' + (erro ? ' erro' : '');
  d.textContent = msg;
  document.getElementById('avisos').appendChild(d);
  setTimeout(function(){ d.remove(); }, 3200);
}

function seletorAluno(idEl){
  return '<label>Aluno</label><select id="'+idEl+'">' +
    db.alunos.map(function(a){
      return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.nome)+'</option>';
    }).join('') + '</select>';
}

/* =========================================================
   GRAFICO RADAR EM SVG PURO (5 eixos, escala 0-10)
   ========================================================= */
function radarSVG(a){
  var cx=150, cy=118, R=82, N=a.materias.length;

  function ponto(i, raio){
    var ang = (-90 + i*(360/N)) * Math.PI/180;
    return [cx + Math.cos(ang)*raio, cy + Math.sin(ang)*raio];
  }
  function poligono(raios){
    return raios.map(function(r,i){ var p = ponto(i,r); return n1(p[0])+','+n1(p[1]); }).join(' ');
  }

  var svg = '<svg viewBox="0 0 300 250" width="100%" role="img" aria-label="Gráfico radar das notas">';

  // aneis da escala: 2, 4, 6, 8, 10
  [2,4,6,8,10].forEach(function(v){
    var r = R*(v/10);
    svg += '<polygon points="'+poligono(a.materias.map(function(){ return r; }))+'" '+
           'fill="none" stroke="rgba(255,255,255,'+(v===10?'.45':'.16')+')" stroke-width="1"/>';
  });

  // eixos + rotulos
  a.materias.forEach(function(m,i){
    var e = ponto(i,R);
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+n1(e[0])+'" y2="'+n1(e[1])+'" stroke="rgba(255,255,255,.22)" stroke-width="1"/>';
    var t   = ponto(i, R+20);
    var anc = t[0] > cx+4 ? 'start' : (t[0] < cx-4 ? 'end' : 'middle');
    var baixa = Number(m.nota) < 6;
    svg += '<text x="'+n1(t[0])+'" y="'+n1(t[1]+4)+'" text-anchor="'+anc+'" font-size="10" font-weight="700" '+
           'fill="'+(baixa ? '#FF4D6D' : '#EDE4FF')+'">'+esc(ABREV[i]||m.nome)+'</text>';
  });

  // area das notas reais
  var raios = a.materias.map(function(m){
    return R * (Math.max(0, Math.min(10, Number(m.nota))) / 10);
  });
  svg += '<polygon points="'+poligono(raios)+'" fill="rgba(139,205,106,.35)" stroke="#8BCD6A" stroke-width="2.5" stroke-linejoin="round"/>';

  // vertices (vermelho quando a materia esta abaixo de 6)
  raios.forEach(function(r,i){
    var p = ponto(i,r);
    var baixa = Number(a.materias[i].nota) < 6;
    svg += '<circle cx="'+n1(p[0])+'" cy="'+n1(p[1])+'" r="4" fill="'+(baixa?'#FF4D6D':'#EFCE74')+'" stroke="#1E357E" stroke-width="1.5"/>';
  });

  return svg + '</svg>';
}

/* =========================================================
   AVATAR ILUSTRADO EM SVG (sem imagem externa)
   ========================================================= */
var CAMISAS = ['#E5484D','#8BCD6A','#EFCE74','#4CD4F0','#FF5C8A','#F97316'];
var CABELOS = ['#2B2118','#4A2C15','#8B5E3C','#111827','#6B4423'];
var PELES   = ['#F7D2AE','#E8B98C','#C68642','#8D5524'];

// escolhe sempre a mesma cor para o mesmo aluno, somando os codigos do id
function corDoAluno(texto, paleta){
  var s = 0;
  for (var i=0;i<texto.length;i++) s += texto.charCodeAt(i);
  return paleta[s % paleta.length];
}

function avatarSVG(a){
  var camisa = corDoAluno(a.id,       CAMISAS);
  var cabelo = corDoAluno(a.id + 'h', CABELOS);
  var pele   = corDoAluno(a.id + 'p', PELES);
  var cid    = 'corte' + a.id;

  return '<svg viewBox="0 0 100 100" role="img" aria-label="Avatar de ' + esc(a.nome) + '">' +
    '<defs><clipPath id="' + cid + '"><circle cx="50" cy="52" r="44"/></clipPath></defs>' +
    '<circle cx="50" cy="52" r="44" fill="#5F9BEF"/>' +
    '<g clip-path="url(#' + cid + ')">' +
      '<path d="M12 100c0-22 17-33 38-33s38 11 38 33z" fill="' + camisa + '"/>' +
      '<rect x="42" y="55" width="16" height="18" rx="7" fill="' + pele + '"/>' +
      '<circle cx="50" cy="40" r="21" fill="' + cabelo + '"/>' +
      '<circle cx="50" cy="46" r="19" fill="' + pele + '"/>' +
    '</g>' +
  '</svg>';
}

/* =========================================================
   RANK E ALERTAS
   ========================================================= */

// posicao do aluno na turma, do maior para o menor media
function rank(a){
  var ord = db.alunos.slice().sort(function(x,y){ return media(y) - media(x); });
  for (var i=0;i<ord.length;i++) if (ord[i].id === a.id) return i + 1;
  return db.alunos.length;
}

// tudo que merece atencao do professor, em ordem de gravidade
function alertas(){
  var lista = [];
  db.alunos.forEach(function(a){
    if (media(a) < 6) lista.push({ id:a.id, tipo:'risco', ic:'\u{1F6A8}', txt: a.nome + ' está EM RISCO, média ' + n1(media(a)) });
  });
  db.alunos.forEach(function(a){
    if (a.faltas >= 5) lista.push({ id:a.id, tipo:'falta', ic:'\u{1F4C5}', txt: a.nome + ' já tem ' + a.faltas + ' faltas' });
  });
  db.alunos.forEach(function(a){
    a.materias.forEach(function(m){
      if (Number(m.nota) < 6) lista.push({ id:a.id, tipo:'nota', ic:'⚠️', txt: a.nome + ' está com ' + n1(m.nota) + ' em ' + m.nome });
    });
  });
  return lista;
}

function atualizarBadge(){
  var n = listaAlertasAtual().length;
  var b = document.getElementById('badgeAlertas');
  b.textContent = n;
  b.className = 'badge' + (n ? '' : ' zero');
}

function painelAlertas(){
  var lista = listaAlertasAtual();

  var f = document.createElement('div');
  f.className = 'modal-fundo';
  f.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
                  '<h2>Alertas da turma</h2>' + corpo +
                  '<div style="height:12px"></div>' +
                  '<button class="acao cinza" data-fechar>FECHAR</button>' +
                '</div>';

  function fechar(){ f.remove(); document.removeEventListener('keydown', tecla); }
  function tecla(e){ if (e.key === 'Escape') fechar(); }

  f.querySelector('[data-fechar]').onclick = fechar;
  f.onclick = function(e){ if (e.target === f) fechar(); };
  document.addEventListener('keydown', tecla);

  document.body.appendChild(f);
  f.querySelector('[data-fechar]').focus();
}

// uma linha da ficha: pilula de rotulo + pilula de valor
function linhaFicha(rot, val, corRot, corVal){
  return '<div class="linha-ficha">' +
           '<span class="rot ' + corRot + '">' + rot + '</span>' +
           '<span class="val ' + corVal + '">' + val + '</span>' +
         '</div>';
}

function corDoSelo(cls){
  if (cls === 'otimo')   return 'amarelo';
  if (cls === 'bom')     return 'verde';
  if (cls === 'regular') return 'ciano';
  return 'vermelho';
}

function medalhasResumo(a){
  var g = MEDALHAS.filter(function(md){ return a.medalhas.indexOf(md.nome) !== -1; });
  if (!g.length) return '<span style="font-size:10px;opacity:.85">nenhuma ainda</span>';
  var icones = g.slice(0,3).map(function(md){ return md.icone; }).join('');
  var resto  = g.length - 3;
  return icones + (resto > 0 ? '<span class="mais">+' + resto + '</span>' : '');
}

function telaPerfil(semSeletor){
  if (!db.alunos.length) {
    return '<div class="card"><div class="vazio">Nenhum aluno cadastrado.<br>Vá em <b>GERENCIAR</b> para adicionar.</div></div>';
  }
  var a = alunoAtual() || db.alunos[0];
  sel = a.id;

  var m     = media(a);
  var s     = selo(m);
  var custo = 100 * a.nivel;
  var pct   = Math.min(100, (a.xp / custo) * 100);
  var pos   = rank(a);

  var h = semSeletor ? '' : '<div class="card so-mobile">' + seletorAluno('selPerfil') + '</div>';

  // ficha: avatar + pilulas
  h += '<div class="card"><div class="ficha">';
  h +=   '<div class="ficha-foto">' + avatarSVG(a) + '</div>';
  h +=   '<div class="ficha-dados">';
  h +=     linhaFicha('Nome',   esc(a.nome),      '', '');
  h +=     linhaFicha('ID',     esc(a.matricula), '', '');
  h +=     linhaFicha('Selo',   s.txt,            '', corDoSelo(s.cls));
  h +=     linhaFicha('Rank',   pos + 'º Lugar',  '', pos === 1 ? 'amarelo' : (pos <= 3 ? 'verde' : ''));
  h +=     linhaFicha('Faltas', a.faltas, 'vermelho', '');
  h +=     '<div class="linha-ficha">' +
             '<span class="rot amarelo">Medalhas</span>' +
             '<span class="val val-medalhas">' + medalhasResumo(a) + '</span>' +
           '</div>';
  h +=   '</div>';
  h += '</div></div>';

  // progresso
  h += '<div class="card"><h2>Progresso</h2>';
  h +=   '<div class="stats">';
  h +=     '<div class="stat"><b>' + n1(m) + '</b><small>Média</small></div>';
  h +=     '<div class="stat"><b>' + a.nivel + '</b><small>Nível</small></div>';
  h +=     '<div class="stat"><b>' + semZero(a.xp) + '</b><small>XP</small></div>';
  h +=   '</div>';
  h +=   '<div class="xp-linha"><span>Para o nível ' + (a.nivel + 1) + '</span><span>' + semZero(a.xp) + ' / ' + custo + '</span></div>';
  h +=   '<div class="xp-fundo"><div class="xp-barra" style="width:' + pct + '%"></div></div>';
  h += '</div>';

  // medalhas detalhadas
  h += '<div class="card"><h2>Medalhas</h2><div class="medalhas">';
  MEDALHAS.forEach(function(md){
    var ok = a.medalhas.indexOf(md.nome) !== -1;
    h += '<div class="medalha' + (ok ? ' ok' : '') + '"><span class="ic">' + md.icone + '</span><span class="tx">' + esc(md.nome) + '</span></div>';
  });
  h += '</div></div>';

  // radar + notas
  h += '<div class="card"><h2>Desempenho</h2>' + radarSVG(a) + '<div class="lista-notas">';
  a.materias.forEach(function(mt){
    var baixa = Number(mt.nota) < 6;
    h += '<div class="linha-nota' + (baixa ? ' baixa' : '') + '"><span>' + esc(mt.nome) + (baixa ? ' &#9888;' : '') + '</span><b>' + n1(mt.nota) + '</b></div>';
  });
  h += '</div></div>';

  return h;
}

/* =========================================================
   TELA - LANCAR NOTAS
   ========================================================= */
function telaNotas(){
  if (!db.alunos.length) {
    return '<div class="card"><div class="vazio">Cadastre um aluno em <b>GERENCIAR</b> antes de lançar notas.</div></div>';
  }
  var a = alunoAtual() || db.alunos[0];
  sel = a.id;

  var h = '<div class="card so-mobile">' + seletorAluno('selNotas') + '</div>';

  h += '<div class="card"><h2>Notas (0 a 10)</h2>';
  a.materias.forEach(function(mt,i){
    var baixa = Number(mt.nota) < 6;
    h += '<div style="margin-bottom:10px">' +
           '<label'+(baixa?' style="color:#FF4D6D"':'')+'>'+esc(mt.nome)+(baixa?' ⚠ baixo desempenho':'')+'</label>' +
           '<input type="number" step="0.1" min="0" max="10" id="nota'+i+'" value="'+mt.nota+'">' +
         '</div>';
  });
  h += '</div>';

  h += '<div class="card"><h2>Frequência</h2>' +
         '<label>Faltas</label>' +
         '<input type="number" step="1" min="0" id="faltas" value="'+a.faltas+'">' +
       '</div>';

  h += '<button class="acao" id="btnSalvarNotas">SALVAR NOTAS</button>';
  return h;
}

// Validacao + XP + nivel + medalhas
function salvarNotas(){
  var a = alunoAtual();
  if (!a) return;

  var valores = [];
  for (var i=0;i<a.materias.length;i++){
    var el = document.getElementById('nota'+i);
    var bruto = el.value.trim();
    if (bruto === '') { aviso('Preencha a nota de ' + a.materias[i].nome, true); el.focus(); return; }
    var v = Number(bruto.replace(',','.'));
    if (isNaN(v))          { aviso('Nota inválida em ' + a.materias[i].nome, true); el.focus(); return; }
    if (v < 0 || v > 10)   { aviso('A nota deve ficar entre 0 e 10', true); el.focus(); return; }
    valores.push(v);
  }

  var elF = document.getElementById('faltas');
  var brutoF = elF.value.trim();
  if (brutoF === '') { aviso('Preencha o campo de faltas', true); elF.focus(); return; }
  var faltas = Number(brutoF);
  if (isNaN(faltas) || faltas < 0 || faltas !== Math.floor(faltas)) {
    aviso('Faltas deve ser um número inteiro maior ou igual a 0', true); elF.focus(); return;
  }

  // XP entra apenas para nota que realmente mudou, senao daria para
  // farmar XP infinito clicando em salvar com os mesmos valores
  var ganho = 0;
  valores.forEach(function(v,i){
    if (Number(a.materias[i].nota) !== v) ganho += v * 10;
    a.materias[i].nota = v;
  });
  a.faltas = faltas;
  a.xp += ganho;

  var subiu   = subirNivel(a);
  var novasMd = conferirMedalhas(a);

  salvar();
  render();

  aviso('Notas salvas! +' + semZero(ganho) + ' XP');
  subiu.forEach(function(nv){   aviso('\u{1F389} Subiu para o nível ' + nv + '!'); });
  novasMd.forEach(function(md){ aviso('\u{1F3C5} Medalha conquistada: ' + md); });
}

/* =========================================================
   TELA - TURMA (visao do professor)
   ========================================================= */
function telaTurma(){
  if (!db.alunos.length) {
    return '<div class="card"><div class="vazio">Nenhum aluno cadastrado ainda.</div></div>';
  }
  var lista = db.alunos
    .map(function(a){ return { nome:a.nome, m:media(a) }; })
    .sort(function(x,y){ return y.m - x.m; });   // maior media primeiro

  var mediaTurma = lista.reduce(function(s,x){ return s + x.m; }, 0) / lista.length;
  var emRisco    = lista.filter(function(x){ return x.m < 6; }).length;

  var h = '<div class="card"><h2>Visão da Turma</h2>';
  h += '<div class="stats" style="margin-bottom:16px">';
  h +=   '<div class="stat"><b>'+lista.length+'</b><small>Alunos</small></div>';
  h +=   '<div class="stat"><b>'+n1(mediaTurma)+'</b><small>Média geral</small></div>';
  h +=   '<div class="stat'+(emRisco?' alerta':'')+'"><b>'+emRisco+'</b><small>Em risco</small></div>';
  h += '</div>';

  lista.forEach(function(x){
    var baixa = x.m < 6;
    h += '<div class="barra-item">' +
           '<div class="barra-topo"><span>'+esc(x.nome)+'</span>' +
           '<b class="'+(baixa?'baixa':'')+'">'+n1(x.m)+'</b></div>' +
           '<div class="barra-fundo"><div class="barra-valor '+(baixa?'baixa':'')+'" style="width:'+(x.m*10)+'%"></div></div>' +
         '</div>';
  });
  h += '</div>';
  return h;
}

function adicionarAluno(){
  var el = document.getElementById('novoNome');
  var nome = el.value.trim();
  if (nome === '') { aviso('Digite o nome do aluno', true); el.focus(); return; }

  var a = novoAluno(nome);
  conferirMedalhas(a);            // aluno novo ja nasce com "Sem Faltas"
  db.alunos.push(a);
  sel = a.id;
  salvar();
  render();
  aviso(nome + ' entrou na turma!');
}

// Caixa de confirmacao propria. O confirm() nativo e bloqueado quando a
// pagina roda dentro de um iframe com sandbox (o caso da versao publicada),
// e ali o botao de remover falharia sem dizer nada.
function confirmar(msg, aoSim){
  var f = document.createElement('div');
  f.className = 'modal-fundo';
  f.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<p>' + esc(msg) + '</p>' +
      '<div class="modal-btns">' +
        '<button class="acao cinza" data-nao>CANCELAR</button>' +
        '<button class="acao vermelha" data-sim>REMOVER</button>' +
      '</div>' +
    '</div>';

  function fechar(){ f.remove(); document.removeEventListener('keydown', tecla); }
  function tecla(e){ if (e.key === 'Escape') fechar(); }

  f.querySelector('[data-nao]').onclick = fechar;
  f.querySelector('[data-sim]').onclick = function(){ fechar(); aoSim(); };
  f.onclick = function(e){ if (e.target === f) fechar(); };
  document.addEventListener('keydown', tecla);

  document.body.appendChild(f);
  f.querySelector('[data-nao]').focus();
}

function removerAluno(id){
  var a = acharAluno(id);
  if (!a) return;

  confirmar('Remover ' + a.nome + '? As notas, o XP e as medalhas serao apagados.', function(){
    db.alunos = db.alunos.filter(function(x){ return x.id !== id; });
    if (sel === id) sel = db.alunos.length ? db.alunos[0].id : null;
    salvar();
    render();
    aviso(a.nome + ' foi removido');
  });
}

/* =========================================================
   ICONE DO PROJETO
   PNG de 128x128 embutido em base64, para o app continuar
   sendo um arquivo unico, sem depender de imagem externa.

function aplicarMarca(){
  document.getElementById('marca').innerHTML = '<img src="' + ICONE + '" alt="">';
  document.getElementById('favicon').href = ICONE;
}

/* =========================================================
   PERFIL DE ACESSO (professor ou aluno)
   Ainda nao e login de verdade: nao ha senha nem conta. E o
   lugar preparado para o login entrar depois, e ja separa o
   que cada um enxerga.
   ========================================================= */
var perfil = null;   // null = tela de escolha | 'professor' | 'aluno'
var euSou  = null;   // id do aluno que entrou, quando perfil e 'aluno'

function telaEscolha(){
  var h = '<div class="tela-escolha">';
  h += '<div class="card"><h2>Quem está entrando?</h2>';
  h +=   '<button class="acao" id="btnEntrarProf">SOU PROFESSOR</button>';
  h +=   '<div class="escolha-ou">OU</div>';

  if (db.alunos.length) {
    h += '<label>Sou aluno</label>' +
         '<select id="selEu">' +
           db.alunos.map(function(a){
             return '<option value="' + a.id + '">' + esc(a.nome) + '</option>';
           }).join('') +
         '</select>' +
         '<div style="height:10px"></div>' +
         '<button class="acao verde" id="btnEntrarAluno">ENTRAR COMO ALUNO</button>';
  } else {
    h += '<div class="vazio">Nenhum aluno cadastrado ainda.<br>Entre como professor para cadastrar o primeiro.</div>';
  }

  h += '</div>';
  h += '<div class="nota-rodape">Por enquanto a escolha é livre, sem senha.<br>É aqui que o login de verdade vai entrar.</div>';
  h += '</div>';
  return h;
}

/* =========================================================
   VISAO DO ALUNO
   O aluno so ve a si mesmo: nao escolhe outro aluno, nao
   edita nota, nao ve a lista da turma. A posicao dele no
   rank aparece, mas sem revelar a nota de ninguem.
   ========================================================= */

// os alertas do aluno logado, escritos na segunda pessoa
function listaAlertasAtual(){
  if (perfil !== 'aluno') return alertas();
  var eu = acharAluno(euSou);
  if (!eu) return [];
  return alertas()
    .filter(function(al){ return al.id === eu.id; })
    .map(function(al){ return { tipo:al.tipo, ic:al.ic, txt: al.txt.replace(eu.nome, 'Você') }; });
}

function cardMelhorar(){
  var meus = listaAlertasAtual();
  var h = '<div class="card"><h2>O que melhorar</h2>';
  h += meus.length
     ? itensAlerta(meus)
     : '<div class="vazio">Tudo em dia! Nenhuma matéria abaixo de 6 e frequência em ordem.</div>';
  return h + '</div>';
}

function telaAluno(){
  var a = acharAluno(euSou) || db.alunos[0];
  if (!a) {
    return '<div class="card"><div class="vazio">Nenhum aluno cadastrado.</div></div>';
  }
  euSou = a.id;
  sel   = a.id;   // o aluno logado e o "selecionado" para reaproveitar a ficha
  return '<div class="tela-aluno">' + telaPerfil(true) + cardMelhorar() + '</div>';
}

/* =========================================================
   RENDER + EVENTOS
   ========================================================= */

// o cabecalho muda conforme quem entrou
function atualizarCabecalho(){
  var abas = document.querySelector('.abas');
  var env  = document.getElementById('btnAlertas');
  var sair = document.getElementById('btnSair');

  // as abas so existem para o professor no celular; no monitor o CSS ja
  // as esconde, e por isso aqui volta para o valor da folha de estilo
  abas.style.display = (perfil === 'professor') ? '' : 'none';
  env.style.visibility = perfil ? 'visible' : 'hidden';
  sair.classList.toggle('aparece', !!perfil);
}

function render(){
  document.querySelectorAll('.aba').forEach(function(b){
    b.classList.toggle('ativa', b.dataset.aba === aba);
  });

  var tela = document.getElementById('tela');

  if (!perfil) {
    tela.innerHTML = telaEscolha();
  } else if (perfil === 'aluno') {
    tela.innerHTML = telaAluno();
  } else if (ehDesktop()) {
    tela.innerHTML = painelProfessor();
  } else if (aba === 'perfil') {
    tela.innerHTML = telaPerfil();
  } else if (aba === 'notas') {
    tela.innerHTML = telaNotas();
  } else if (aba === 'turma') {
    tela.innerHTML = telaTurma();
  } else {
    tela.innerHTML = telaGerenciar();
  }

  atualizarCabecalho();
  ligarEventos();
  atualizarBadge();
}

// ao arrastar a janela entre celular e monitor, redesenha no layout certo
var eraDesktop = null;
window.addEventListener('resize', function(){
  var agora = ehDesktop();
  if (agora !== eraDesktop) { eraDesktop = agora; render(); }
});

function ligarEventos(){
  var sp = document.getElementById('selPerfil');
  if (sp) sp.onchange = function(){ sel = this.value; render(); };

  var sn = document.getElementById('selNotas');
  if (sn) sn.onchange = function(){ sel = this.value; render(); };

  var bs = document.getElementById('btnSalvarNotas');
  if (bs) bs.onclick = salvarNotas;

  var ba = document.getElementById('btnAdd');
  if (ba) ba.onclick = adicionarAluno;

  var nn = document.getElementById('novoNome');
  if (nn) nn.onkeydown = function(e){ if (e.key === 'Enter') adicionarAluno(); };

  var bp = document.getElementById('btnEntrarProf');
  if (bp) bp.onclick = function(){ perfil = 'professor'; aba = 'perfil'; render(); };

  var bal = document.getElementById('btnEntrarAluno');
  if (bal) bal.onclick = function(){
    var s = document.getElementById('selEu');
    perfil = 'aluno';
    euSou  = s ? s.value : (db.alunos[0] || {}).id;
    render();
    aviso('Bem-vindo, ' + (acharAluno(euSou) || {}).nome + '!');
  };

  document.querySelectorAll('[data-sel]').forEach(function(b){
    b.onclick = function(){ sel = this.dataset.sel; render(); };
  });

  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); removerAluno(this.dataset.del); };
  });
}

document.querySelectorAll('.aba').forEach(function(b){
  b.onclick = function(){ aba = this.dataset.aba; render(); };
});

document.getElementById('btnAlertas').onclick = painelAlertas;

document.getElementById('btnSair').onclick = function(){
  perfil = null; euSou = null; aba = 'perfil'; render();
};

aplicarMarca();
carregar();
render();
</script>
