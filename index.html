<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduQuest</title>
<link rel="icon" href="img/icone.png">
<meta name="theme-color" content="#6C3BD2">
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="css/missoes.css">
<link rel="stylesheet" href="css/ranking.css">
<link rel="stylesheet" href="css/frequencia.css">
</head>
<body>
<div id="avisos" role="status" aria-live="polite"></div>

<div id="app">
  <div class="topo">
    <button class="icone" id="btnSair" title="Trocar de perfil" aria-label="Trocar de perfil">&#8592;</button>
    <div class="logo"><span class="marca"><img src="img/icone.png" alt=""></span><span class="palavra"><span>E</span><span>d</span><span>u</span><span>Q</span><span>u</span><span>e</span><span>s</span><span>t</span></span></div>
    <button class="icone" id="btnAlertas" title="Alertas da turma" aria-label="Alertas da turma">&#9993;<span class="badge" id="badgeAlertas">0</span></button>
  </div>

  <div class="abas">
    <button class="aba" data-aba="perfil">PERFIL</button>
    <button class="aba" data-aba="notas">NOTAS</button>
    <button class="aba" data-aba="turma">TURMA</button>
    <button class="aba" data-aba="gerenciar">GERENCIAR</button>
  </div>

  <div id="tela"></div>
</div>

<!-- a ordem importa: app.js chama carregar() e render(), que usam os outros -->
<script src="js/dados.js"></script>
<script src="js/regras.js"></script>
<script src="js/graficos.js"></script>
<script src="js/telas.js"></script>
<script src="js/missoes.js"></script>
<script src="js/ranking.js"></script>
<script src="js/frequencia.js"></script>
<script src="js/app.js"></script>
</body>
</html>
